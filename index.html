<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRC ไทวัสดุ – ภาพรวมสินค้าค้างส่ง</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--soft:#f7f2e9;--bg:#ffffff;--card:#ffffff;--ink:#3d3027;--mut:#8a7a68;--line:#e9dfcd;--day:#d9a05b;--night:#8c6a52;--plan:#7d9b76;--ask:#c9704f;--of:#e3c35f;--no:#d9d0c1;--pad:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:var(--pad)}
html,body{background:#fff!important}body{margin:0;color-scheme:light;padding:var(--pad) 0 env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font:400 15px/1.5 Prompt,"Noto Sans Thai",Tahoma,sans-serif}
html,body{height:100%}.w{max-width:1440px;margin:0 auto;padding:12px 16px;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px}.hd{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:600}.sub{color:var(--mut);font-size:13px}
.sum{margin:0;padding:10px 16px;border-radius:16px;background:linear-gradient(120deg,#7d9b76,#b8895a);color:#fff}
.sum p{margin:1px 0;font-size:14px;line-height:1.45}.sum b{font-weight:600}
.k{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.k .c{padding:8px 14px}
.c{background:var(--card);border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.kv{font-size:22px;font-weight:600;line-height:1.2}.kl{color:var(--mut);font-size:13px}.ks{font-size:12px;margin-top:2px}
.g{flex:1;min-height:0;display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:12px}.col{display:flex;flex-direction:column;min-height:0}.sc{flex:1;min-height:0;overflow:auto}.stk{display:grid;grid-template-rows:1fr 1fr;gap:12px;min-height:0}.stk .c{min-height:0;overflow:hidden;display:flex;flex-direction:column}.stk .dn{flex:1;min-height:0}.stk .dn svg{width:96px;height:96px}.stk .note{margin-top:4px}
@media(max-width:980px),(max-height:560px){.w{height:auto}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g{grid-template-columns:1fr;flex:none}.sc{overflow:visible}.stk{grid-template-rows:none}.stk .c{overflow:visible}}
h2{font-size:16px;margin:0 0 8px;font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:3px 11px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}.chip.on{border-color:var(--ink);font-weight:500}.chip:focus-visible,.row:focus-visible,.drow:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--day);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;background:var(--card);color:var(--ink);min-width:0;flex:1}
.row{display:grid;grid-template-columns:104px 100px 1fr 46px;gap:8px;align-items:center;padding:2px 6px;border-radius:10px;cursor:pointer}
.row:hover,.row.sel{background:var(--soft)}.nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drow{display:grid;grid-template-columns:1fr 60px;gap:2px 8px;padding:4px 6px;border-radius:10px;cursor:pointer;font-size:13px}.drow:hover,.drow.on{background:var(--soft)}.drow .bar{grid-column:1/3;height:8px}.bar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--line)}.bar span{height:100%}
.v{font-size:13px;text-align:right;font-weight:500}
.det{margin:2px 6px 8px 112px;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:13px}
.det div{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.more{margin-top:8px;border:0;background:var(--day);color:#fff;border-radius:20px;padding:6px 16px;font:inherit;cursor:pointer}
.dn{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.dn svg{width:130px;height:130px;flex:none}
.sl{flex:1;min-width:140px;font-size:13px}.sl div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.note{color:var(--mut);font-size:12px;margin-top:8px}
</style></head><body><div class="w">
<div class="hd"><h1>ภาพรวมสินค้าค้างส่ง CRC ไทวัสดุ</h1><div class="sub" id="sub"></div></div>
<div class="sum" id="sum"></div>
<div class="k" id="k"></div>
<div class="g">
<div class="c col"><h2>น้ำหนักพร้อมรับรายสาขา แยกตามสถานะ (คอลัมน์ NOTE)</h2>

<div class="c"><h2>สัดส่วน SKU ขาดสต็อก (OOS)</h2><div class="dn"><svg id="d2" viewBox="0 0 42 42"></svg><div class="sl" id="ol"></div></div>
<div class="note" id="on"></div></div>
</div></div></div>
<script>
const D={"B":["กาญจนบุรี","กาฬสินธุ์","กำแพงเพชร","ขอนแก่น","จันทบุรี","ฉะเชิงเทรา","ชลบุรี","ชะอำ","ชัยนาท","ชัยพฤกษ์","ชัยภูมิ","ตรัง","ตาก","นครนายก","นครปฐม","นครราชสีมา","นครศรีธรรมราช","นครสวรรค์","นครอินทร์","นวมินทร์","บางนา","บางบอน","บางบัวทอง","บางพลี","บางแสน","บางใหญ่","บุรีรัมย์","บ่อวิน","บ้านฉาง","ปทุมธานี","ปากช่อง","พระราม 2","พระราม 3","พัทยาใต้","พิษณุโลก","ภูเก็ต ฉลอง","ภูเก็ต ถลาง","ภูเก็ต เฟสติวัล","มหาชัย","มหาสารคาม","มิตรภาพ ขอนแก่น","มุกดาหาร","ยโสธร","ระยอง","รังสิต 1","รังสิต คลองสี่","รังสิต-คลองหลวง","รัตนาธิเบศร์","ราชบุรี","ร้อยเอ็ด","ลพบุรี","ลำปาง","ลำลูกกา","ศรีมหาโพธิ","ศรีราชา","ศรีสมาน","ศรีสะเกษ","ศาลายา","สกลนคร","สงขลา","สมุทรปราการ","สระบุรี","สระแก้ว","สุขสวัสดิ์","สุขาภิบาล 3","สุพรรณบุรี","สุราษฎร์ธานี","สุรินทร์","หนองจอก","หนองบัวลำภู","หาดใหญ่","อยุธยา","อรัญประเทศ","อุดรธานี","อุดรธานี กุดสระ","อุทัยธานี","อ้อมน้อย","เชียงราย","เชียงใหม่","เชียงใหม่ สันทราย","เพชรบุรี","เพชรบูรณ์","เมืองเอก","เลย","แกลง","แจ้งวัฒนะ","แพร่","แม่จัน","โคราช-หัวทะเล"],"S":["ส่งวันที่ 13.10.2026","ส่งวันที่ 14.10.2026","ส่งวันที่ 15.10.2026","ส่งวันที่ 16.10.2026","ส่งกลางคืน 12.10.2026","ส่งกลางคืน 15.10.2026","ส่งตามแผน 30.10.2026 -09.11.2026","ขอนน.เพิ่มเพื่อวางแผนส่ง","**มี OF**ขอนน.เพิ่มเพื่อวางแผนส่ง"],"C":["DAY","DAY","DAY","DAY","NIGHT","NIGHT","PLAN","ASK","OF"],"R":[[0,1,0.553,1.196],[1,7,5.786,0.553],[2,7,5.149,0.85],[3,8,0.329,0.0],[4,7,8.177,0.0],[5,7,1.82,1.106],[6,3,24.287,0.0],[7,7,1.42,0.0],[8,0,22.508,0.975],[9,7,4.615,1.106],[10,7,0.507,0.975],[11,7,0.825,1.528],[12,2,32.11,0.0],[13,1,16.912,0.0],[14,7,1.631,0.0],[15,3,12.546,1.403],[16,7,0.907,0.85],[17,7,3.397,0.0],[18,7,4.622,1.528],[19,4,13.711,0.507],[20,4,13.144,3.021],[21,7,0.084,0.85],[22,7,5.558,1.106],[23,7,0.825,0.553],[24,3,12.451,0.0],[25,7,4.048,0.0],[26,7,2.188,0.0],[27,7,6.246,0.85],[28,7,1.794,0.975],[29,5,11.276,1.528],[30,7,0.0,0.553],[31,7,1.48,1.528],[32,7,6.391,0.975],[33,7,4.189,0.0],[34,7,14.896,0.0],[35,7,11.576,0.0],[36,7,8.97,0.975],[37,7,9.925,0.553],[38,7,7.444,0.0],[39,3,29.972,0.0],[40,7,7.4,0.85],[41,7,8.185,0.0],[42,7,6.884,1.55],[43,2,15.134,1.749],[44,7,7.811,0.85],[45,7,6.043,0.0],[46,6,147.204,1.9],[47,7,0.553,0.553],[48,1,10.465,0.975],[49,3,27.096,0.975],[50,2,13.741,3.056],[51,7,7.776,0.0],[52,7,2.308,1.749],[53,7,3.584,0.0],[54,3,14.024,2.171],[55,7,10.171,0.0],[56,7,0.0,0.507],[57,7,9.349,0.0],[58,2,30.533,2.171],[59,7,1.816,0.85],[60,5,28.051,0.975],[61,7,3.226,1.95],[62,7,5.162,0.507],[63,7,2.653,0.507],[64,4,32.705,2.081],[65,0,20.23,0.35],[66,7,3.328,3.9],[67,7,3.404,0.0],[68,7,6.059,0.975],[69,7,17.761,0.553],[70,7,7.069,1.106],[71,7,11.355,0.975],[72,7,2.259,0.85],[73,7,9.163,0.85],[74,7,13.673,0.0],[75,7,8.303,0.0],[76,7,2.277,0.553],[77,7,2.387,4.224],[78,8,13.852,0.0],[79,7,21.821,0.0],[80,2,10.221,0.0],[81,7,6.212,0.0],[82,7,2.12,0.0],[83,7,3.386,0.0],[84,0,28.803,0.975],[85,7,5.733,2.171],[86,7,17.637,0.0],[87,1,34.325,0.975],[88,0,21.269,2.332]],"M":{"sku":14283,"oos":335,"of":17,"oosdate":"05.10.2026","asof":"12.10.2026","plan":"30.10–09.11"}};
const CAT={DAY:['ส่งตามวันที่ (กลางวัน)','--day'],NIGHT:['ส่งกลางคืน','--night'],PLAN:['ส่งตามแผน '+D.M.plan,'--plan'],ASK:['ขอ นน.เพิ่มเพื่อวางแผน','--ask'],OF:['มี OF · ขอ นน.เพิ่ม','--of']};
const col=c=>`var(${CAT[c][1]})`;const f=(n,d=1)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const SKU=D.M.sku,OOS=D.M.oos,S_=SKU-OOS;
document.getElementById('sub').textContent=`รายงานประจำสัปดาห์ · ข้อมูล ณ ${D.M.asof} · หน่วย: ตัน (Tons)`;
document.getElementById('on').textContent=`OOS ตามชีต pivot (update ล่าสุด ${D.M.oosdate}) · มี OF ${D.M.of} SKU อยู่ในกลุ่มมีสต็อก (Normal+OF)`;
let fs=null,flt=null,sel=null,all=false,qs='';
const R=D.R.map(([b,s,r,n])=>({b,s,r,n,c:D.C[s]}));
const dk=s=>{const m=s.match(/(\d\d)\.(\d\d)\.(\d{4})/);return m?m[3]+m[2]+m[1]:'9'};
const sh=i=>{const c=D.C[i],m=D.S[i].match(/\d\d\.\d\d/),r2=D.S[i].includes('รอบ 2')?' (2)':'';return c=='ASK'||c=='OF'?'รอ นน.เพิ่ม':c=='PLAN'?'แผน '+D.M.plan:c=='NIGHT'?'คืน '+m[0]+r2:'ส่ง '+m[0]};
const tot=a=>a.reduce((x,y)=>x+y.r+y.n,0),rd=a=>a.reduce((x,y)=>x+y.r,0);
const T=tot(R),RD=rd(R),NS=T-RD;
const bc={};Object.keys(CAT).forEach(c=>bc[c]=rd(R.filter(x=>x.c==c)));
const br=D.B.map((n,i)=>{const a=R.filter(x=>x.b==i);return{i,n,a,t:tot(a),r:rd(a)}}).sort((x,y)=>y.t-x.t);
const topC=Object.keys(bc).sort((a,b)=>bc[b]-bc[a])[0];
document.getElementById('sum').innerHTML=
`<p>ค้างส่งรวม <b>${f(T)} ตัน</b> จาก ${D.B.length} สาขา · พร้อมรับ <b>${f(RD)} ตัน (${f(RD/T*100)}%)</b> · ไม่มีของ <b>${f(NS)} ตัน</b></p>
<p>สถานะส่วนใหญ่: <b>${CAT[topC][0]}</b> ${f(bc[topC])} ตัน (${f(bc[topC]/RD*100)}% ของน้ำหนักพร้อมรับ)</p>
<p>ค้างสูงสุด 3 สาขา: ${br.slice(0,3).map(x=>`<b>${x.n.trim()}</b> ${f(x.t)} ตัน`).join(' · ')}</p>`;
document.getElementById('k').innerHTML=[
['ค้างส่งรวม',f(T)+' T',`${D.B.length} สาขา`,'--day'],['พร้อมรับ',f(RD)+' T',f(RD/T*100)+'% ของค้างส่ง','--plan'],
['ไม่มีของ',f(NS)+' T',f(NS/T*100)+'% ของค้างส่ง','--ask'],['SKU ทั้งหมด',f(SKU,0),'จากชีต pivot','--night'],['OOS',f(OOS,0)+' SKU',f(OOS/SKU*100,2)+'% ของ SKU','--of']
].map(k=>`<div class="c" style="border-top:4px solid var(${k[3]})"><div class="kl">${k[0]}</div><div class="kv">${k[1]}</div><div class="ks kl">${k[2]}</div></div>`).join('');
function leg(){document.getElementById('leg').innerHTML=Object.keys(CAT).map(c=>`<button class="chip ${flt==c?'on':''}" data-c="${c}"><i style="background:${col(c)}"></i>${CAT[c][0]}</button>`).join('')+((flt||fs!==null)?'<button class="chip" data-c="">ล้างตัวกรอง ✕</button>':'');}
function donut(id,parts,lid){let o=0,h='';const C=2*Math.PI*15.9;const t=parts.reduce((a,p)=>a+p.v,0);
parts.forEach(p=>{const l=p.v/t*C;h+=`<circle r="15.9" cx="21" cy="21" fill="none" stroke="${p.c}" stroke-width="7" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 21 21)"${p.k?` data-c="${p.k}" style="cursor:pointer"`:''}/>`;o+=l});
document.getElementById(id).innerHTML=h;document.getElementById(lid).innerHTML=parts.map(p=>`<div><span><i class="chip" style="padding:0;width:10px;height:10px;border:0;background:${p.c}"></i> ${p.n}</span><b>${p.t}</b></div>`).join('');}
donut('d1',Object.keys(CAT).map(c=>({v:bc[c],c:col(c),k:c,n:CAT[c][0],t:f(bc[c])+' T'})),'sl');
donut('d2',[{v:OOS,c:'var(--ask)',n:'OOS',t:f(OOS,0)+' ('+f(OOS/SKU*100,2)+'%)'},{v:S_,c:'var(--plan)',n:'มีสต็อก',t:f(S_,0)+' ('+f(S_/SKU*100,2)+'%)'}],'ol');
function dl(a){const m={};a.forEach(x=>m[x.s]=(m[x.s]||0)+x.r+x.n);const k=Object.keys(m).sort((x,y)=>m[y]-m[x]),u=[...new Set(k.map(s=>sh(+s)))];return u.slice(0,2).join(' · ')+(u.length>2?' +'+(u.length-2):'')}
function dpanel(){const m={};R.forEach(x=>m[x.s]=(m[x.s]||0)+x.r);const k=Object.keys(m).map(Number).sort((a,b)=>dk(D.S[a]).localeCompare(dk(D.S[b]))||D.S[a].localeCompare(D.S[b])),mx=Math.max(...k.map(s=>m[s]));
document.getElementById('dl').innerHTML=k.map(s=>`<div class="drow ${fs===s?'on':''}" data-s="${s}" tabindex="0" role="button"><span>${D.S[s]}</span><b style="text-align:right">${f(m[s])}</b><div class="bar"><span style="width:${m[s]/mx*100}%;background:${col(D.C[s])}"></span></div></div>`).join('')}
function render(){leg();dpanel();
let L=br.map(b=>{const a=b.a.filter(x=>(!flt||x.c==flt)&&(fs===null||x.s==fs));return{...b,a,t:tot(a),r:rd(a)}}).filter(b=>b.t>0&&b.n.includes(qs)).sort((x,y)=>y.t-x.t);
const mx=Math.max(...L.map(b=>b.t),1),shown=L;let h='';
shown.forEach(b=>{const seg=Object.keys(CAT).map(c=>{const v=rd(b.a.filter(x=>x.c==c));return v?`<span style="width:${v/mx*100}%;background:${col(c)}" title="${CAT[c][0]} ${f(v)} T"></span>`:''}).join('');
const ns=b.t-b.r;h+=`<div class="row ${sel===b.i?'sel':''}" tabindex="0" role="button" data-b="${b.i}"><div class="nm" title="${b.n}">${b.n}</div><div class="dt" title="${dl(b.a)}">${dl(b.a)}</div><div class="bar">${seg}<span style="width:${ns/mx*100}%;background:var(--no)" title="ไม่มีของ ${f(ns)} T"></span></div><div class="v">${f(b.t)}</div></div>`;
if(sel===b.i){const m={};b.a.forEach(x=>{m[x.s]=(m[x.s]||0)+x.r});h+=`<div class="det"><div><b>พร้อมรับ ${f(b.r)} T</b><b>ไม่มีของ ${f(ns)} T</b></div>`+Object.keys(m).sort((x,y)=>m[y]-m[x]).map(s=>`<div><span><i class="chip" style="padding:0;width:8px;height:8px;border:0;background:${col(D.C[s])}"></i> ${D.S[s]}</span><span>${f(m[s],2)} T</span></div>`).join('')+'</div>'}});
document.getElementById('list').innerHTML=h||'<div class="note">ไม่พบข้อมูล</div>';
}
document.addEventListener('click',e=>{const c=e.target.closest('[data-c]'),r=e.target.closest('[data-b]'),q=e.target.closest('[data-s]');
if(q){const i=+q.dataset.s;fs=fs===i?null:i;flt=null;render()}else if(c){const v=c.dataset.c;flt=v&&flt!==v?v:null;fs=null;render()}else if(r){const i=+r.dataset.b;sel=sel===i?null:i;render()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.target.dataset.b||e.target.dataset.s)){e.target.click()}});
document.getElementById('q').oninput=e=>{qs=e.target.value.trim();render()};
render();
</script></body></html>
